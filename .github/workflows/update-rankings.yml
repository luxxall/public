name: Update Rankings Monthly

on:
  schedule:
    # 7:00 AM on the 1st of every month
    - cron: '0 7 1 * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      working-directory: ./scraper
      run: npm install

    - name: Install Puppeteer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxrandr2 libxdamage1 libxkbcommon0 libasound2t64

    - name: Run scraper script
      working-directory: ./scraper
      run: node update_rankings.js

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/sites/projects.html
        git diff-index --quiet HEAD || git commit -m "Automated update of rankings data"
        git push

