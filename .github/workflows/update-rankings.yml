name: Update Rankings Monthly

on:
  schedule:
    # 7:00 AM on the 1st of every month
    - cron: '0 7 1 * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Uprawnienia zapisu do repozytorium dla automatycznego commita i pusha
permissions:
  contents: write

jobs:
  update-rankings:
    # Przypięta wersja systemu dla stabilności i powtarzalności środowiska
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './scraper/package-lock.json'

    - name: Install dependencies
      working-directory: ./scraper
      run: npm install

    - name: Install Puppeteer browser dependencies
      working-directory: ./scraper
      run: |
        sudo apt-get update
        sudo -E env "PATH=$PATH" npx puppeteer browsers install chrome --install-deps
        sudo chown -R $USER:$USER /home/runner/.cache || true

    - name: Run scraper
      working-directory: ./scraper
      run: node update_rankings.js

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/sites/projects.html
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated update of rankings data [skip ci]"
          git push
        else
          echo "Brak zmian w tabeli rankingów - pomijanie commita."
        fi

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_WAY_TO_IT }}'
        channelId: live
        projectId: my-way-to-it
